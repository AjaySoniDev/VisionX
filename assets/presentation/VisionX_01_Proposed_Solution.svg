<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img" aria-labelledby="title desc">
  <title id="title">VisionX learned-route workflow</title>
  <desc id="desc">Updated original six-stage workflow. Team-reported implemented Pi Zero 2 W, camera, VL53L0X, hotspot and Android stream feed a temporary YOLOv8s live detection test with TTS and headphones. Offline VXN-RAMNet implements constrained route memory, branch evidence and abstention. Live VXN mobile integration is in progress; route speech and IMU fusion remain target work. Dashed connectors show target integration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 5L0 10Z" fill="#142333"/>
    </marker>
    <style>
      .txt{font-family:Arial,Helvetica,sans-serif;font-weight:400;fill:#111111}
      .card{stroke:#111111;stroke-width:3.4}
      .rule{stroke:#111111;stroke-width:1.6;stroke-linecap:round}
      .flow{fill:none;stroke:#111111;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .aux{fill:none;stroke:#111111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 9;marker-end:url(#arrow)}
      .iconB{fill:none;stroke:#205ba6;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .iconP{fill:none;stroke:#6b4097;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  <marker id="arrow-new" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 5L0 10Z" fill="#142333"/></marker></defs>

  <rect width="1800" height="1800" fill="#ffffff"/>

  <!-- Flow connectors, routed outside the central core for a clean circular composition -->
  <path class="flow" d="M1208 225 H1482 V398"/>
  <path class="flow" d="M1482 735 V992" stroke-dasharray="12 9"/>
  <path class="flow" d="M1482 1322 V1492 H1208"/>
  <path class="flow" d="M592 1492 H318 V1348"/>
  <path class="flow" d="M318 992 V735" stroke-dasharray="12 9"/>
  <path class="flow" d="M900 1690 V1642"/>
  <!-- Connector labels -->
  <text class="txt" x="1340" y="205" font-size="27" text-anchor="middle" id="text-000">Teaching workflow</text>
  <text class="txt" x="1498" y="874" font-size="25" text-anchor="start" id="text-001">Offline video input</text>
  <text class="txt" x="1360" y="1466" font-size="27" text-anchor="middle" id="text-002">Read saved memory</text>
  <text class="txt" x="922" y="1677" font-size="27" text-anchor="start" id="text-003">Query video</text>
  <text class="txt" x="448" y="1466" font-size="27" text-anchor="middle" id="text-004">Branch evidence</text>
  <text class="txt" x="340" y="848" font-size="24" text-anchor="start" id="text-005">Route speech</text>

  <!-- Health / proximity target callout -->
  <!-- 1: Teach a familiar route -->
  <rect class="card" x="592" y="78" width="616" height="270" rx="22" fill="#CFABE9"/>
  <circle cx="640" cy="126" r="25" fill="#ffffff" stroke="#142333" stroke-width="3"/>
  <text class="txt" x="640" y="137" font-size="32" text-anchor="middle" id="text-006">1</text>
  <text class="txt" x="684" y="138" font-size="36" id="text-007">Teach a familiar route</text>
  <line class="rule" x1="620" y1="164" x2="1180" y2="164"/>
  <g class="iconP" transform="translate(624 194) scale(1.05)">
    <path d="M24 9Q12 2 3 8v34q10-6 21 1 11-7 21-1V8Q36 2 24 9v34"/>
  </g>
  <text class="txt" x="688" y="222" font-size="30" id="text-008">Record one structured journey.</text>
  <text class="txt" x="688" y="263" font-size="30" id="text-009">One junction • two taught branches.</text>

  <!-- 2: Capture route evidence -->
  <rect class="card" x="1215" y="398" width="535" height="337" rx="22" fill="#B6D4F7"/>
  <circle cx="1263" cy="446" r="25" fill="#ffffff" stroke="#142333" stroke-width="3"/>
  <text class="txt" x="1263" y="457" font-size="32" text-anchor="middle" id="text-010">2</text>
  <text class="txt" x="1307" y="458" font-size="33" id="text-011">Working capture node</text>
  <line class="rule" x1="1243" y1="484" x2="1722" y2="484"/>
  <g class="iconB" transform="translate(1244 516) scale(1.02)">
    <path d="M3 12h8l4-6h18l4 6h8v30H3Z"/><circle cx="24" cy="27" r="10"/><circle cx="24" cy="27" r="5"/>
  </g>
  <text class="txt" x="1308" y="545" font-size="28" id="text-012">Pi Zero 2 W + camera</text>
  <text class="txt" x="1308" y="586" font-size="28" id="text-013">VL53L0X distance sensor</text>
  <text class="txt" x="1308" y="627" font-size="28" id="text-014">Pi hotspot → Android stream</text>
  <text class="txt" x="1308" y="668" font-size="28" id="text-015">IMPLEMENTED • team report</text>

  <!-- 3: Build personal route memory -->
  <rect class="card" x="1215" y="992" width="535" height="330" rx="22" fill="#B6D4F7"/>
  <circle cx="1263" cy="1040" r="25" fill="#ffffff" stroke="#142333" stroke-width="3"/>
  <text class="txt" x="1263" y="1051" font-size="32" text-anchor="middle" id="text-016">3</text>
  <text class="txt" x="1307" y="1052" font-size="33" id="text-017">Build route memory</text>
  <line class="rule" x1="1243" y1="1078" x2="1722" y2="1078"/>
  <g class="iconB" transform="translate(1244 1110) scale(1.02)">
    <ellipse cx="24" cy="9" rx="18" ry="7"/><path d="M6 9v30c0 9 36 9 36 0V9M6 19c0 9 36 9 36 0M6 29c0 9 36 9 36 0"/>
  </g>
  <text class="txt" x="1308" y="1140" font-size="28" id="text-018">Common path • Junction</text>
  <text class="txt" x="1308" y="1181" font-size="28" id="text-019">Branch A • Backtrack • Branch B</text>
  <text class="txt" x="1308" y="1222" font-size="28" id="text-020">Visual turnaround heuristic</text>
  <text class="txt" x="1308" y="1263" font-size="25" id="text-021">Versioned memory + reports</text>

  <!-- 4: Branch-aware recall -->
  <rect class="card" x="592" y="1360" width="616" height="282" rx="22" fill="#B6D4F7"/>
  <circle cx="640" cy="1408" r="25" fill="#ffffff" stroke="#142333" stroke-width="3"/>
  <text class="txt" x="640" y="1419" font-size="32" text-anchor="middle" id="text-022">4</text>
  <text class="txt" x="684" y="1420" font-size="36" id="text-023">Branch-aware recall</text>
  <line class="rule" x1="620" y1="1446" x2="1180" y2="1446"/>
  <g class="iconB" transform="translate(624 1484) scale(1.06)">
    <circle cx="21" cy="20" r="14"/><path d="M31 31l14 14"/>
  </g>
  <text class="txt" x="688" y="1517" font-size="30" id="text-024">Match query windows to memory.</text>
  <text class="txt" x="688" y="1559" font-size="30" id="text-025">Aggregate branch evidence.</text>
  <text class="txt" x="688" y="1601" font-size="30" id="text-026">Completed videos • offline core</text>

  <!-- 5: Evidence-gated decision -->
  <rect class="card" x="50" y="992" width="535" height="356" rx="22" fill="#B6D4F7"/>
  <circle cx="98" cy="1040" r="25" fill="#ffffff" stroke="#142333" stroke-width="3"/>
  <text class="txt" x="98" y="1051" font-size="32" text-anchor="middle" id="text-027">5</text>
  <text class="txt" x="142" y="1052" font-size="33" id="text-028">Evidence-gated decision</text>
  <line class="rule" x1="78" y1="1078" x2="557" y2="1078"/>
  <rect x="76" y="1100" width="483" height="48" rx="8" fill="#9DDAC5" stroke="#142333" stroke-width="1.8"/>
  <rect x="76" y="1160" width="483" height="48" rx="8" fill="#FFDB96" stroke="#142333" stroke-width="1.8"/>
  <rect x="76" y="1220" width="483" height="48" rx="8" fill="#e2e7ee" stroke="#142333" stroke-width="1.8"/>
  <text class="txt" x="92" y="1133" font-size="27" id="text-029">Known branch</text>
  <text class="txt" x="312" y="1133" font-size="25" id="text-030">Supported match</text>
  <text class="txt" x="92" y="1193" font-size="27" id="text-031">Uncertain</text>
  <text class="txt" x="312" y="1193" font-size="25" id="text-032">Ambiguous evidence</text>
  <text class="txt" x="92" y="1253" font-size="27" id="text-033">Unknown route</text>
  <text class="txt" x="312" y="1253" font-size="25" id="text-034">No adequate match</text>
  <text class="txt" x="76" y="1317" font-size="27" id="text-035">Heuristic thresholds • uncalibrated</text>

  <!-- 6: Accessible assistance -->
  <rect class="card" x="50" y="398" width="535" height="337" rx="22" fill="#B6D4F7"/>
  <circle cx="98" cy="446" r="25" fill="#ffffff" stroke="#142333" stroke-width="3"/>
  <text class="txt" x="98" y="457" font-size="32" text-anchor="middle" id="text-036">6</text>
  <text class="txt" x="142" y="458" font-size="33" id="text-037">Accessible assistance</text>
  <line class="rule" x1="78" y1="484" x2="557" y2="484"/>
  <g class="iconB" transform="translate(78 518) scale(1.02)">
    <path d="M3 18h10L25 7v34L13 30H3ZM32 15q11 9 0 18M39 8q18 16 0 32"/>
  </g>
  <text class="txt" x="142" y="546" font-size="28" id="text-038">Phone TTS → headphones</text>
  <text class="txt" x="142" y="587" font-size="28" id="text-039">IMPLEMENTED for detections</text>
  <text class="txt" x="142" y="628" font-size="25" id="text-040">VXN mobile port: IN PROGRESS</text>
  <text class="txt" x="142" y="669" font-size="28" id="text-041">Route / fault policy: TARGET</text>

  <!-- Central research core: enlarged and visually integrated -->
  <circle cx="900" cy="866" r="300" fill="#ffffff" stroke="#142333" stroke-width="3.6"/>
  <g class="iconB" transform="translate(870 615) scale(1.28)">
    <ellipse cx="24" cy="9" rx="18" ry="7"/><path d="M6 9v30c0 9 36 9 36 0V9M6 19c0 9 36 9 36 0M6 29c0 9 36 9 36 0"/>
  </g>
  <text class="txt" x="900" y="745" font-size="53" text-anchor="middle" id="text-042">VXN-RAMNet</text>
  <text class="txt" x="900" y="792" font-size="32" text-anchor="middle" id="text-043">Personal visual route memory</text>
  <text class="txt" x="900" y="875" font-size="28" text-anchor="middle" id="text-044">IMPLEMENTED RESEARCH CORE</text>
  <text class="txt" x="900" y="920" font-size="33" text-anchor="middle" id="text-045">Offline • camera-only</text>
  <text class="txt" x="900" y="994" font-size="28" text-anchor="middle" id="text-046">No GPS input or route markers</text>
  <text class="txt" x="900" y="1040" font-size="25" text-anchor="middle" id="text-047">IMU turn/backtrack fusion: PLANNED</text>

  <!-- New journey input -->
  <rect class="card" x="718" y="1690" width="364" height="80" rx="14" fill="#B6D4F7"/>
  <g class="iconB" transform="translate(742 1708) scale(0.92)">
    <path d="M3 12h8l4-6h18l4 6h8v30H3Z"/><circle cx="24" cy="27" r="10"/><circle cx="24" cy="27" r="5"/>
  </g>
  <text class="txt" x="806" y="1741" font-size="31" id="text-048">New journey</text>
<path d="M1750 565 H1774 V38 H290 V78" fill="none" stroke="#142333" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-new)"/><text x="1370" y="66" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142333" text-anchor="middle" id="text-049">Live camera stream</text><rect x="50" y="78" width="480" height="270" rx="22" fill="#CFABE9" stroke="#142333" stroke-width="3.4" id="live-test-card"/><line x1="78" y1="164" x2="502" y2="164" class="rule"/><text x="78" y="138" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142333" text-anchor="start" id="text-050">YOLOv8s mobile detection</text><text x="78" y="211" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#142333" text-anchor="start" id="text-051">CURRENT INTEGRATION TEST</text><text x="78" y="254" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#142333" text-anchor="start" id="text-052">Temporary detection model</text><text x="78" y="297" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#142333" text-anchor="start" id="text-053">Pi → Android tested up to ~1 h*</text><path d="M290 348 V398" fill="none" stroke="#142333" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-new)"/><text x="310" y="379" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142333" text-anchor="start" id="text-054">Detection text</text><text x="900" y="1120" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#142333" text-anchor="middle" id="text-055">* Test duration reported by team</text><text x="688" y="311" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142333" text-anchor="start" id="text-056">Core scope: saved teaching video</text><text x="1505" y="918" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#142333" text-anchor="start" id="text-057">Handoff: TARGET</text><text x="340" y="887" fill="#142333" font-family="Arial, Helvetica, sans-serif" font-size="24" id="text-058">TARGET</text></svg>
