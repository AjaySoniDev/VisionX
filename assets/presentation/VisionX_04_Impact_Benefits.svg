<text x="153.0" y="75" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#111111;" id="text-000">Impact Area</text>
<text x="567.0" y="75" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#111111;" id="text-001">Potential Benefit</text>
<text x="1314.0" y="75" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#111111;" id="text-002">Evidence / Validation Boundary</text>
<text x="153.0" y="206" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:29px;font-weight:700;fill:#111111;" id="text-003">SOCIAL</text>
<text x="153.0" y="398" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:29px;font-weight:700;fill:#111111;" id="text-004">ECONOMIC</text>
<text x="153.0" y="541.0" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700;fill:#111111;" id="text-005">ENVIRONMENTAL</text>
<text x="298" y="157.0" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:27px;font-weight:400;fill:#111111;" id="text-006">Spoken visual information</text>
<rect x="886" y="130.0" width="148" height="36" rx="18" fill="#CFABE9" stroke="#142333" stroke-width="1.7"/><text x="960" y="155.0" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#142333;" id="text-007">LIVE TEST</text>
<text x="1054" y="138.0" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:400;fill:#142333;" id="text-008"><tspan x="1054" dy="0">Pi → Android → YOLOv8s → TTS → headphones works.*</tspan><tspan x="1054" dy="28">Detection feedback is demonstrated; user benefit is unvalidated.</tspan></text>
<text x="298" y="253.0" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:27px;font-weight:400;fill:#111111;" id="text-009">Recognition of taught routes</text>
<rect x="886" y="226.0" width="148" height="36" rx="18" fill="#B6D4F7" stroke="#142333" stroke-width="1.7"/><text x="960" y="251.0" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#142333;" id="text-010">CORE</text>
<text x="1054" y="234.0" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:400;fill:#142333;" id="text-011"><tspan x="1054" dy="0">Offline VXN-RAMNet: branch memory + abstention.</tspan><tspan x="1054" dy="28">Android integration in progress; route benefit requires trials.</tspan></text>
<text x="298" y="349.0" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:27px;font-weight:400;fill:#111111;" id="text-012">Reuse smartphone compute</text>
<rect x="886" y="322.0" width="148" height="36" rx="18" fill="#CFABE9" stroke="#142333" stroke-width="1.7"/><text x="960" y="347.0" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#142333;" id="text-013">LIVE TEST</text>
<text x="1054" y="330.0" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:400;fill:#142333;" id="text-014"><tspan x="1054" dy="0">Phone processes the Pi stream with YOLOv8s today.*</tspan><tspan x="1054" dy="28">VXN route processing on mobile remains integration work.</tspan></text>
<text x="298" y="445.0" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:27px;font-weight:400;fill:#111111;" id="text-015">Staged route-level deployment</text>
<rect x="886" y="418.0" width="148" height="36" rx="18" fill="#FFDB96" stroke="#142333" stroke-width="1.7"/><text x="960" y="443.0" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#142333;" id="text-016">TARGET</text>
<text x="1054" y="426.0" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:400;fill:#142333;" id="text-017"><tspan x="1054" dy="0">Campus evaluation, then an institutional pilot if validated.</tspan><tspan x="1054" dy="28">Full BOM, demand and support cost remain unvalidated.</tspan></text>
<text x="298" y="541.0" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:27px;font-weight:400;fill:#111111;" id="text-018">Phone reuse / fewer markers</text>
<rect x="886" y="514.0" width="148" height="36" rx="18" fill="#FFDB96" stroke="#142333" stroke-width="1.7"/><text x="960" y="539.0" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#142333;" id="text-019">TO MEASURE</text>
<text x="1054" y="522.0" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:400;fill:#142333;" id="text-020"><tspan x="1054" dy="0">Visual route memory needs no installed route markers.</tspan><tspan x="1054" dy="28">Energy, materials and net environmental benefit are unmeasured.</tspan></text>
</g>
<rect x="34" y="28" width="1732" height="552" rx="18" ry="18" fill="none" stroke="#142333" stroke-width="3"/>
<rect x="34" y="608" width="1732" height="70" rx="16" fill="#F5F7FA" stroke="#142333" stroke-width="1.5"/><text x="60" y="636" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#142333" text-anchor="start" id="text-021">LIVE TEST: current mobile integration   •   CORE: implemented offline research   •   TARGET: proposed capability</text><text x="60" y="664" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#142333" text-anchor="start" id="text-022">* Team-reported hardware / live pipeline. Intended social, economic and environmental outcomes still require validation.</text></g></svg>
